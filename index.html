<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Plan Diario</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
height:100vh;
}

.screen{
display:none;
height:100vh;
padding:20px;
}

.screen.active{
display:flex;
flex-direction:column;
}

.home{
justify-content:center;
align-items:center;
text-align:center;
}

.logo{
font-size:42px;
margin-bottom:20px;
}

.app-title{
font-size:32px;
font-weight:bold;
margin-bottom:20px;
}

.start-btn{
background:#2563eb;
color:white;
border:none;
padding:18px 40px;
font-size:22px;
border-radius:15px;
cursor:pointer;
}

.quote{
margin-top:20px;
color:#666;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
box-shadow:0 -2px 10px rgba(0,0,0,.15);
}

.nav-btn{
background:none;
border:none;
font-size:16px;
cursor:pointer;
}

.page-title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.placeholder{
margin-top:30px;
font-size:18px;
color:#666;
}

</style>
</head>

<body>

<div id="home" class="screen active home">

<div class="logo">🚀</div>

<div class="app-title">
PLAN DIARIO
</div>

<button class="start-btn"
onclick="showScreen('today')">
EMPEZÁ AHORA
</button>

<div class="quote">
Lo que hagas hoy determina tu mañana
</div>

</div>

<div id="today" class="screen">

<div class="page-title">
Planificación diaria
</div>

<div class="placeholder">
Acá irá la pantalla actual que ya construimos.
</div>

</div>

<div id="stats" class="screen">

<div class="page-title">
📊 Métricas
</div>

<div class="placeholder">
Próximamente
</div>

</div>

<div id="inbox" class="screen">

<div class="page-title">
📥 Inbox
</div>

<div class="placeholder">
Acá irán todas las tareas e ideas capturadas.
</div>

</div>

<div id="history" class="screen">

<div class="page-title">
📅 Historial
</div>

<div class="placeholder">
Acá veremos los días anteriores.
</div>

</div>

<div class="bottom-nav">

<button class="nav-btn"
onclick="showScreen('stats')">
📊
</button>

<button class="nav-btn"
onclick="showScreen('inbox')">
📥
</button>

<button class="nav-btn"
onclick="showScreen('today')">
▶️
</button>

<button class="nav-btn"
onclick="showScreen('history')">
📅
</button>

<button class="nav-btn"
onclick="showScreen('settings')">
⚙️
</button>

</div>

<script>

function showScreen(id){

document
.querySelectorAll('.screen')
.forEach(screen =>
screen.classList.remove('active'));

document
.getElementById(id)
.classList.add('active');

}

</script>

</body>
</html>
