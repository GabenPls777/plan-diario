<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificación Diaria</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 24px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .row input[type="text"] {
      flex: 1;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }

      .container {
        background: #1e1e1e;
        color: white;
      }

      input[type="text"],
      input[type="date"] {
        background: #2b2b2b;
        color: white;
        border-color: #555;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Planificación Diaria</h1>

  <label>
    Fecha
    <input id="fecha" type="date">
  </label>

  <h2>1. Compromisos Fijos</h2>

  <div id="compromisos"></div>

  <label>
    Horas reales disponibles
    <input type="text" placeholder="Ej: 4 horas">
  </label>

  <h2>2. Pendientes</h2>

  <div id="pendientes"></div>

  <h2>3. Bloques de Tiempo</h2>

  <div id="bloques"></div>

  <h2>4. Cierre Diario</h2>

  <label>
    <input type="checkbox">
    Día completo
  </label>

  <h3>¿Qué pasa para mañana?</h3>

  <div id="manana"></div>

  <label>
    Tarea más importante de mañana
    <input type="text">
  </label>

</div>

<script>
document.getElementById("fecha").value =
  new Date().toISOString().split("T")[0];

const compromisos = document.getElementById("compromisos");

for(let i=0;i<6;i++){
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Compromiso fijo";
  input.style.marginBottom = "8px";
  compromisos.appendChild(input);
}

const pendientes = document.getElementById("pendientes");

for(let i=0;i<12;i++){
  const row = document.createElement("div");
  row.className = "row";

  row.innerHTML = `
    <input type="checkbox">
    <input type="text" placeholder="Pendiente">
  `;

  pendientes.appendChild(row);
}

const bloques = document.getElementById("bloques");

for(let i=0;i<8;i++){
  const row = document.createElement("div");
  row.className = "grid2";

  row.innerHTML = `
    <input type="text" placeholder="Horario">
    <input type="text" placeholder="Actividad">
  `;

  bloques.appendChild(row);
}

const manana = document.getElementById("manana");

for(let i=0;i<5;i++){
  const row = document.createElement("div");
  row.className = "row";

  row.innerHTML = `
    <input type="checkbox">
    <input type="text" placeholder="Actividad para mañana">
  `;

  manana.appendChild(row);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
</html>
